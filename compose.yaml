services:
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DFS_REDIS_TEST_URL: redis://redis:6379/0
      DFS_MOUNT_TEST: "1"
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  dfs:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DFS_REDIS_URL: redis://redis:6379/0
      DFS_STORAGE: s3
      R2_ENDPOINT: ${R2_ENDPOINT:-https://59f68cb1f4d832c4b78cf873cf2069cb.r2.cloudflarestorage.com}
      R2_BUCKET: ${R2_BUCKET:-ffs}
      R2_REGION: ${R2_REGION:-auto}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    # Allow FUSE mount operations on engines with AppArmor enabled.
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./data/r2-volume:/app/data
    healthcheck:
      test: ["CMD", "mountpoint", "-q", "/app/mnt"]
      interval: 2s
      timeout: 2s
      retries: 15
    stop_grace_period: 15s

volumes:
  redis-data:
