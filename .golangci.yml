version: "2"

# Run from the repository root: golangci-lint run ./...
# Checks production and test code without suppressing an existing baseline.
run:
  timeout: 3m
  tests: true

linters:
  default: standard
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - gocritic
    - gosec
    - makezero
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testableexamples
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
